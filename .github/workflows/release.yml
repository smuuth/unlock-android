name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # `secrets` ist in Step-`if:` nicht erlaubt (macht die ganze Datei ungültig) – daher über env prüfen.
      UNLOCK_KEYSTORE_BASE64: ${{ secrets.UNLOCK_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: ${{ env.UNLOCK_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$UNLOCK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/unlock-release.jks"
          echo "UNLOCK_KEYSTORE_PATH=$RUNNER_TEMP/unlock-release.jks" >> "$GITHUB_ENV"

      - name: Run tests & build signed release APK
        env:
          UNLOCK_KEYSTORE_PASSWORD: ${{ secrets.UNLOCK_KEYSTORE_PASSWORD }}
          UNLOCK_KEY_ALIAS: ${{ secrets.UNLOCK_KEY_ALIAS }}
          UNLOCK_KEY_PASSWORD: ${{ secrets.UNLOCK_KEY_PASSWORD }}
          UNLOCK_TELEMETRY_APP_ID: ${{ secrets.UNLOCK_TELEMETRY_APP_ID }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Rename release APK
        run: cp app/build/outputs/apk/release/app-release.apk "Unlock-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Unlock-${{ github.ref_name }}.apk
